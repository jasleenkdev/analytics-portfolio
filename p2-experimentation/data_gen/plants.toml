# Planted effects for project 2. Read ONLY by the generator and the final cross-check.

[srm]
day = 3                     # assignment day index with the logging bug
lost_control_share = 0.35   # share of control assignments dropped from the log that day

[promo_effect]
order_lift_by_week = [0.15, 0.07, 0.03]   # treatment lift in order rate, weeks 1-3 since assignment (novelty)
new_user_extra_lift = 0.08                # additional lift for users who signed up < 90 days before
high_margin_multiplier = 0.70             # treatment reduces the chance an order is a high-margin basket
bunching_window = 6.0                     # baskets this far below the new threshold may be topped up
bunching_prob = 0.50

[pilot_effect]
rider_min_per_order = -0.12   # relative change in rider minutes per order for treated nodes after start
delivery_min = 1.4            # added mean delivery minutes (batched orders wait for a partner order)
defect_rate_pp = 0.60         # added defect rate in percentage points (guardrail regression)
sla_pp = -1.5                 # change in % within SLA, percentage points

[pilot_data_quality]
control_nodes_with_gaps = 1    # control node(s) that lose a few days of data (picked at random)
missing_days = [20, 21, 22]
