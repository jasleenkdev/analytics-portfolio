name: build-and-verify

# Manual only: Pages is served from the gh-pages branch built locally with `make pages`.
# Run this workflow by hand to rebuild and test on a clean runner when Actions is available.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: rebuild data, metrics, tests, dashboards and reports
        run: make all PYTHON_BOOT=python
      - name: confirm the rebuild matches the committed outputs
        run: git diff --exit-code
